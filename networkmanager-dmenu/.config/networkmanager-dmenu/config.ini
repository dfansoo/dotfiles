[dmenu]
dmenu_command = wofi --dmenu --conf ~/.config/wofi/config --style ~/.config/wofi/style.css
highlight = True
highlight_fg = #161616
highlight_bg = #33b1ff
highlight_bold = True
compact = False
wifi_chars = ▂▄▆█
format = {name}  {bars}  {sec}
list_saved = True
prompt = Wi-Fi Networks

[dmenu_passphrase]
obscure = False

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
