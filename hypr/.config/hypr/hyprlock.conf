background {
    monitor =
    color = rgba(22, 22, 22, 1.0)
    blur_passes = 2
    blur_size = 4
}

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = false
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(51, 177, 255)
    inner_color = rgb(38, 38, 38)
    font_color = rgb(242, 244, 248)
    fade_on_empty = false
    placeholder_text = <span foreground="##f2f4f8">Enter password...</span>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(51, 177, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(242, 244, 248, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(61, 219, 217, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
